<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Michael Horacek</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --fg: #1a1a1a;
        --muted: #6b6b6b;
        --bg: #fafaf7;
        --accent: #0a7d4a;
        --rule: #e6e4dd;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: Inter, Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }
      main { padding: 160px 32px 140px; }
      .content { max-width: 780px; margin: 0 auto; }
      @media (max-width: 640px) {
        main { padding: 96px 22px; }
      }
      h1 {
        font-size: 3rem;
        letter-spacing: -0.035em;
        line-height: 1.02;
        font-weight: 600;
        margin: 0 0 0.55em;
      }
      p {
        margin: 0 0 1.1em;
        color: #333;
        max-width: 65ch;
      }
      .intro p {
        font-size: 1.08rem;
        color: #2a2a2a;
      }
      a {
        color: var(--fg);
        text-decoration: underline;
        text-decoration-color: var(--accent);
        text-decoration-thickness: 1.5px;
        text-underline-offset: 3px;
      }
      a:hover { color: var(--accent); }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.9rem 1.25rem;
        margin: 2.2em 0 0;
      }
      .links p { margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <div class="content">
        <h1>Michael Horacek</h1>
        <div class="intro">
          <p>Builder. Operator. Working on the next useful thing.</p>
          <p>Foster original thinking. Conformity is optional.</p>
        </div>
        <div class="links">
          <p><a href="https://x.com/elysianfields">X</a></p>
          <p><a href="https://github.com/elholg25-hub">GitHub</a></p>
          <p><a href="mailto:m.horacek@hey.com">m.horacek@hey.com</a></p>
        </div>
      </div>
    </main>
  </body>
</html>
